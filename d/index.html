<style>
:root{
  --ink:#14213D; --muted:#5B6476; --line:#E3E6EC; --paper:#fff; --bg:#F5F6F8;
  --brand:#C2410C; --brand-deep:#9A3412; --brand-soft:#FFF1E8; --on-brand:#fff;
  --zap:#1E9E52; --zap-deep:#167A3F;
  --font:"Poppins","Avenir Next","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
body[data-p="emergencia"]{--brand:#E3A82B;--brand-deep:#B5811A;--brand-soft:#FFF6E0;--on-brand:#14213D;--hero:#0F1E2E}
body[data-p="agenda"]{--brand:#7C3AED;--brand-deep:#5B21B6;--brand-soft:#F3EEFF}
body[data-p="site"]{--brand:#0F766E;--brand-deep:#115E59;--brand-soft:#E6F6F4}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:calc(132px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}
.demo{background:var(--ink);color:#fff;font-size:12px;font-weight:600;text-align:center;padding:7px 16px;padding-top:calc(7px + env(safe-area-inset-top,0px));letter-spacing:.02em}
.demo b{color:#FFD08A}
.hero{background:var(--hero,var(--brand));color:#fff;padding:26px 0 24px}
body[data-p="emergencia"] .hero{color:#fff}
.tag{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500}
.tag i{width:8px;height:8px;border-radius:50%;background:#3DDC84}
h1{font-size:clamp(30px,9vw,44px);line-height:1.02;letter-spacing:-.02em;margin:12px 0 6px;text-wrap:balance}
body[data-p="emergencia"] h1{text-transform:uppercase}
body[data-p="emergencia"] h1 span{color:var(--brand)}
.sub{margin:0;opacity:.9;font-size:15.5px}
.hero-cta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;border:0;font-weight:700;font-size:16px;text-decoration:none;padding:0 14px}
.btn-zap{background:var(--zap);color:#fff}
.btn-zap:active{background:var(--zap-deep)}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.35)}
.btn-brand{background:var(--brand);color:var(--on-brand)}
.btn svg{width:20px;height:20px;flex:none}
.note{background:var(--brand-soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);margin:16px 0 0}
section{margin-top:22px}
h2{font-size:19px;margin:0 0 10px;letter-spacing:-.01em}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:3}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.items{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px}
.item .ico{width:52px;height:52px;border-radius:12px;background:var(--brand-soft);display:grid;place-items:center;font-size:26px;flex:none}
.item .t{flex:1;min-width:0}
.item b{display:block;font-size:15.5px}
.item small{color:var(--muted);font-size:13px;display:block}
.price{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.qty .add{width:40px;height:40px;border-radius:12px;border:0;background:var(--brand);color:var(--on-brand);font-size:22px;font-weight:700;flex:none;line-height:1}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px;text-align:left;font-weight:600;font-size:14.5px;min-height:52px}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
input,textarea,select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--paper)}
textarea{min-height:80px;resize:vertical}
.loc{margin-top:8px;width:100%;border:1.5px dashed var(--brand);background:var(--brand-soft);color:var(--ink);border-radius:12px;padding:11px;font-weight:600}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:64px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 0;text-align:center;font-weight:700}
.day small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.day[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--on-brand)}
.day[aria-pressed="true"] small{color:inherit;opacity:.85}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.time{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 0;font-weight:600;font-variant-numeric:tabular-nums}
.time[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--on-brand)}
.time:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.feat{display:grid;gap:10px}
.feat div{display:flex;gap:12px;align-items:flex-start}
.feat span{font-size:22px;line-height:1}
.feat p{margin:0}
.feat small{color:var(--muted)}
.foot{color:var(--muted);font-size:12.5px;text-align:center;margin:28px 0 8px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.dock .wrap{display:grid;gap:8px}
.bag{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bag .btn{flex:1}
.sell{display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border-radius:12px;background:var(--ink);color:#fff;text-decoration:none;font-weight:600;font-size:14px}
.sell b{color:#FFD08A}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div class="demo" id="demo"></div>
<header class="hero"><div class="wrap" id="hero"></div></header>
<main class="wrap" id="main"></main>
<p class="foot wrap" id="foot"></p>
<div class="dock"><div class="wrap" id="dock"></div></div>
<div class="toast" id="toast" hidden></div>
<script>
(function(){
'use strict';
var DONO='5511945522214';
var q=new URLSearchParams(location.search);
function clean(s,max){return String(s||'').replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,max||80);}
var P=['cardapio','emergencia','agenda','site'].indexOf(q.get('p'))>=0?q.get('p'):'cardapio';
var NOME=clean(q.get('n'),60)||'Seu Negócio';
var CIDADE=clean(q.get('c'),50);
var NICHO=clean(q.get('t'),50).toLowerCase();
var WPP=String(q.get('w')||'').replace(/\D/g,'');
if(WPP && WPP.length<=11) WPP='55'+WPP;
if(WPP.length<12) WPP='';
var PRODUTO={cardapio:'Cardápio Digital',emergencia:'Página de Emergência',agenda:'Agenda Online',site:'Site Vitrine'}[P];
document.body.dataset.p=P;
document.title=NOME+' · Exemplo da Freguesia';

function el(tag,attrs,kids){var e=document.createElement(tag);if(attrs)for(var k in attrs){if(k==='text')e.textContent=attrs[k];else if(k==='cls')e.className=attrs[k];else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),attrs[k]);else if(attrs[k]!=null)e.setAttribute(k,attrs[k]);}
  (kids||[]).forEach(function(c){if(c)e.appendChild(typeof c==='string'?document.createTextNode(c):c);});return e;}
var ZAPICO='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.4 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.7-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.5.3.1.2.1.8-.1 1.4Z"/></svg>';
var TELICO='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2Z"/></svg>';
function zapLink(num,txt){return 'https://wa.me/'+num+'?text='+encodeURIComponent(txt);}
function abrir(txt){
  if(!WPP){toast('No sistema de verdade, este pedido chega no WhatsApp de '+NOME+'.');return;}
  window.open(zapLink(WPP,txt),'_blank','noopener');
}
function toast(t){var x=document.getElementById('toast');x.textContent=t;x.hidden=false;clearTimeout(toast.k);toast.k=setTimeout(function(){x.hidden=true;},3200);}
function has(){for(var i=0;i<arguments.length;i++)if(NICHO.indexOf(arguments[i])>=0||NOME.toLowerCase().indexOf(arguments[i])>=0)return true;return false;}
function brl(v){return 'R$ '+v.toFixed(2).replace('.',',');}

/* topo e rodapé comuns */
var demo=document.getElementById('demo');
demo.appendChild(document.createTextNode('Exemplo feito pela Freguesia para '));demo.appendChild(el('b',{text:NOME}));
document.getElementById('foot').textContent=PRODUTO+' feito pela Freguesia · mais fregueses pro seu negócio';
var hero=document.getElementById('hero'), main=document.getElementById('main'), dock=document.getElementById('dock');
var sell=el('a',{cls:'sell',href:zapLink(DONO,'Oi! Vi o exemplo de '+PRODUTO+' do '+NOME+' e quero colocar no ar.'),target:'_blank',rel:'noopener'});
sell.appendChild(document.createTextNode('Gostou? '));sell.appendChild(el('b',{text:'Quero isso no meu negócio →'}));
var lugar=CIDADE?(' · '+CIDADE):'';

/* ===================== CARDÁPIO ===================== */
function cardapio(){
  var C;
  if(has('pizz')) C=[['Pizzas',[['🍕','Calabresa','Mussarela, calabresa e cebola',49.9],['🍕','Frango com catupiry','Frango desfiado e catupiry',54.9],['🍕','Portuguesa','Presunto, ovo, cebola e azeitona',54.9],['🍕','Quatro queijos','Mussarela, provolone, parmesão e catupiry',57.9]]],['Bebidas',[['🥤','Refrigerante 2 L','',14],['🧃','Suco natural 500 ml','',9]]]];
  else if(has('aça','acai','açai')) C=[['Açaí',[['🍧','Açaí 300 ml','Com 3 adicionais',16],['🍧','Açaí 500 ml','Com 4 adicionais',22],['🍧','Açaí 700 ml','Com 5 adicionais',28]]],['Adicionais',[['🍓','Morango','',4],['🥜','Paçoca','',3],['🍌','Banana','',2.5]]]];
  else if(has('esfi','esfir')) C=[['Esfihas',[['🥟','Esfiha de carne','',5.5],['🥟','Esfiha de queijo','',5.5],['🥟','Esfiha de calabresa','',6],['🥟','Esfiha de frango com catupiry','',6.5]]],['Bebidas',[['🥤','Refrigerante lata','',6]]]];
  else if(has('past')) C=[['Pastéis',[['🥟','Pastel de carne','',10],['🥟','Pastel de queijo','',10],['🥟','Pastel de frango com catupiry','',12],['🥟','Pastel especial da casa','',16]]],['Bebidas',[['🥤','Caldo de cana 500 ml','',8],['🥤','Refrigerante lata','',6]]]];
  else if(has('marmit','quentinha','restaurante')) C=[['Marmitas',[['🍱','Marmita P','Arroz, feijão, salada e 1 carne',18],['🍱','Marmita M','Arroz, feijão, salada e 1 carne',22],['🍱','Marmita G','Arroz, feijão, salada e 2 carnes',27]]],['Bebidas',[['🥤','Refrigerante lata','',6],['🧃','Suco 300 ml','',6]]]];
  else if(has('doce','confeit','bolo')) C=[['Bolos',[['🍰','Bolo no pote','',12],['🎂','Bolo inteiro 1 kg','Sob encomenda',70]]],['Doces',[['🍫','Brigadeiro (cento)','',110],['🍬','Beijinho (cento)','',110]]]];
  else if(has('salgad')) C=[['Salgados (cento)',[['🥟','Coxinha','',75],['🧀','Bolinha de queijo','',70],['🥐','Enroladinho de salsicha','',70],['🥟','Kibe','',75]]]];
  else if(has('dog','cachorro')) C=[['Cachorro-quente',[['🌭','Dog simples','Pão, salsicha, molho e batata palha',12],['🌭','Dog duplo','Duas salsichas, purê e queijo',17],['🌭','Dog especial','Frango, catupiry, milho e bacon',20]]],['Bebidas',[['🥤','Refrigerante lata','',6]]]];
  else if(has('burg','hamb')) C=[['Burgers',[['🍔','Clássico','Pão brioche, blend 150 g, queijo e salada',26],['🍔','Cheddar bacon','Blend 150 g, cheddar e bacon crocante',32],['🍔','Duplo smash','Dois smash, queijo e molho da casa',34]]],['Acompanhamentos',[['🍟','Batata frita','Porção individual',14]]],['Bebidas',[['🥤','Refrigerante lata','',6]]]];
  else C=[['Lanches',[['🍔','X-Burguer','Pão, hambúrguer e queijo',16],['🍔','X-Salada','Pão, hambúrguer, queijo e salada',19],['🍔','X-Tudo','Completo, com ovo e bacon',27]]],['Porções',[['🍟','Batata frita','',18]]],['Bebidas',[['🥤','Refrigerante lata','',6]]]];
  hero.append(el('span',{cls:'tag'},[el('i'),'Pedido direto, sem taxa de aplicativo']),el('h1',{text:NOME}),el('p',{cls:'sub',text:'Peça pelo celular e receba em casa'+lugar}));
  main.append(el('p',{cls:'note',text:'Itens e preços de exemplo. No seu cardápio entram os seus produtos, fotos e preços.'}));
  var bag={}, nav=el('nav',{cls:'cats','aria-label':'Categorias'}), sec=el('section');
  C.forEach(function(cat,ci){
    var id='cat'+ci;
    nav.appendChild(el('button',{cls:'chip','aria-pressed':ci===0?'true':'false',text:cat[0],onclick:function(){document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'});[].forEach.call(nav.children,function(b){b.setAttribute('aria-pressed','false');});this.setAttribute('aria-pressed','true');}}));
    var box=el('div',{cls:'items',id:id,style:'scroll-margin-top:56px'});
    cat[1].forEach(function(it){
      var key=it[1];
      var qtyBox=el('div',{cls:'qty'});
      function draw(){qtyBox.textContent='';var n=bag[key]?bag[key].q:0;
        if(!n){qtyBox.appendChild(el('button',{cls:'add','aria-label':'Adicionar '+it[1],text:'+',onclick:function(){bag[key]={q:1,p:it[3]};draw();sum();}}));}
        else{qtyBox.append(el('button',{'aria-label':'Tirar um',text:'−',onclick:function(){bag[key].q--;if(!bag[key].q)delete bag[key];draw();sum();}}),el('b',{text:String(n)}),el('button',{'aria-label':'Mais um',text:'+',onclick:function(){bag[key].q++;draw();sum();}}));}}
      draw();
      box.appendChild(el('div',{cls:'item'},[el('div',{cls:'ico',text:it[0]}),el('div',{cls:'t'},[el('b',{text:it[1]}),it[2]?el('small',{text:it[2]}):null,el('span',{cls:'price',text:brl(it[3])})]),qtyBox]));
    });
    sec.append(el('h2',{text:cat[0],style:'margin-top:'+(ci?'20px':'0')}),box);
  });
  main.append(el('section',{},[nav]),sec);
  var form=el('section',{},[el('h2',{text:'Finalizar pedido'}),el('div',{cls:'card'},[
    el('label',{for:'nome',text:'Seu nome'}),el('input',{id:'nome',autocomplete:'name',placeholder:'Como podemos te chamar?'}),
    el('label',{for:'end',text:'Endereço de entrega'}),el('input',{id:'end',autocomplete:'street-address',placeholder:'Rua, número e bairro'}),
    el('label',{for:'pg',text:'Pagamento'}),(function(){var s=el('select',{id:'pg'});['Pix','Cartão na entrega','Dinheiro'].forEach(function(o){s.appendChild(el('option',{text:o}));});return s;})()
  ])]);
  main.appendChild(form);
  var total=el('span',{cls:'price',text:brl(0)});
  var go=el('button',{cls:'btn btn-zap',onclick:function(){
    var ks=Object.keys(bag);if(!ks.length){toast('Escolha pelo menos um item.');return;}
    var t=0,l=['*Pedido pelo cardápio digital*',''];ks.forEach(function(k){t+=bag[k].q*bag[k].p;l.push(bag[k].q+'x '+k+' — '+brl(bag[k].q*bag[k].p));});
    l.push('','*Total:* '+brl(t),'Nome: '+(document.getElementById('nome').value||'-'),'Endereço: '+(document.getElementById('end').value||'-'),'Pagamento: '+document.getElementById('pg').value);

  go.innerHTML=ZAPICO;go.appendChild(document.createTextNode(' Enviar pedido'));
  function sum(){var t=0,n=0;for(var k in bag){t+=bag[k].q*bag[k].p;n+=bag[k].q;}total.textContent=brl(t)+(n?' · '+n+(n>1?' itens':' item'):'');}
  dock.append(el('div',{cls:'bag'},[total,go]),sell);
}

/* ===================== EMERGÊNCIA ===================== */
function emergencia(){
  var S, h24=has('24','chaveir','guinch','socorro','desentup');
  if(has('chaveir')) S=['Fiquei trancado do lado de fora','Perdi a chave','Chave do carro','Fechadura com defeito','Cópia de chave','Outro'];
  else if(has('guinch','socorro','reboque')) S=['Carro não liga','Pneu furado','Acidente','Pane seca','Transporte de veículo','Outro'];
  else if(has('desentup')) S=['Pia entupida','Vaso entupido','Ralo ou esgoto','Caixa de gordura','Outro'];
  else if(has('encan','hidr')) S=['Vazamento','Cano estourado','Sem água','Caixa d\'água','Outro'];
  else if(has('eletric')) S=['Sem energia','Curto-circuito','Disjuntor desarmando','Tomada ou chuveiro','Outro'];
  else if(has('vidr')) S=['Vidro quebrado','Box de banheiro','Janela','Espelho','Outro'];
  else if(has('serralh','port')) S=['Portão travado','Motor do portão','Grade ou fechadura','Solda','Outro'];
  else if(has('dedetiz')) S=['Baratas','Cupim','Ratos','Escorpião','Outro'];
  else S=['Atendimento urgente','Orçamento','Outro'];
  var nomeParts=NOME.split(' '), last=nomeParts.length>1?nomeParts.pop():'';
  var h1=el('h1');h1.append(document.createTextNode(nomeParts.join(' ')+(last?' ':'')));if(last)h1.appendChild(el('span',{text:last}));
  hero.append(el('span',{cls:'tag'},[el('i'),h24?'Atende 24 horas':'Atendimento rápido']),h1,el('p',{cls:'sub',text:'Chegamos até você'+lugar+'. Chame e mande a localização.'}));
  var cta=el('div',{cls:'hero-cta'});
  var bz=el('button',{cls:'btn btn-zap',onclick:function(){abrir('Olá! Preciso de atendimento.');}});bz.innerHTML=ZAPICO;bz.appendChild(document.createTextNode(' WhatsApp'));
  var bt=el('a',{cls:'btn btn-ghost',href:WPP?'tel:+'+WPP:'#',onclick:function(e){if(!WPP){e.preventDefault();toast('No sistema de verdade, este botão liga direto para '+NOME+'.');}}});bt.innerHTML=TELICO;bt.appendChild(document.createTextNode(' Ligar'));
  cta.append(bz,bt);hero.appendChild(cta);
  var sel='';var grid=el('div',{cls:'grid2'});
  S.forEach(function(s){grid.appendChild(el('button',{cls:'opt','aria-pressed':'false',text:s,onclick:function(){sel=s;[].forEach.call(grid.children,function(b){b.setAttribute('aria-pressed','false');});this.setAttribute('aria-pressed','true');}}));});
